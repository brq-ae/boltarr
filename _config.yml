# GitHub Pages for boltarr.net: the README as a page in Boltarr's own look
# (_layouts/default.html + assets/css/site.css; no file list).
# A proper landing page comes later (planner R-23).
title: Boltarr
description: Self-hosted network dashboard. See what's on your network, and whether it's working.

# Only the README and its docs are published; the code stays on GitHub
exclude:
  - backend
  - frontend/css
  - frontend/js
  - frontend/vendor
  - frontend/index.html
  - frontend/login.html
  - statuspage
  - templates
  - tests
  - data
  - scripts
  - Dockerfile
  - docker-compose.yml
  - docker-compose.ollama.yml
  - requirements.txt
  - requirements-dev.txt
  - run.sh
  - VERSION
