name: Build & Push status page image

on:
  push:
    branches: [master, main]
    paths:
      - 'statuspage/**'
      - 'tests/test_statuspage.py'
      - '.github/workflows/statuspage.yml'
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run status page tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests/test_statuspage.py

  build:
    needs: test  # no image is pushed unless the status page tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./statuspage
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/boltarr-statuspage:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/boltarr-statuspage:${{ github.sha }}
