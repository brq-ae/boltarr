name: Build & Push Docker image

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nmap (as in the image; some tests need its port lists)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nmap

      - name: Run tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests

      # Browser checks: load the real pages in jsdom (no server) and click through them
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run browser checks
        working-directory: tests/js
        run: |
          npm ci --no-audit --no-fund
          node run_all.js

  build:
    needs: test  # no image is built unless every test passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build for normal PCs (amd64) and ARM (arm64: Raspberry Pi 3/4/5, ARM NAS).
      # The ARM half is built under emulation; nothing is compiled, so it's only a few minutes more.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Version label from the VERSION file (e.g. 0.24.0), so rolling back is just ":0.23.x"
      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/boltarr:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/boltarr:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/boltarr:${{ github.sha }}
