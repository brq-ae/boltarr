<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Status</title>
<link rel="stylesheet" href="/static/style.css">
</head><body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1 id="title">Service Status</h1>
      <div class="updated" id="updated"></div>
    </div>
    <div id="authbox"><button id="loginBtn" class="btn">Login</button></div>
  </div>

  <div id="adminPanel" class="admin hidden"></div>
  <div id="banner" class="hidden"></div>
  <div id="list"></div>

  <div class="foot">Powered by Boltarr</div>
</div>

<div id="loginModal" class="modal hidden">
  <div class="modal-card">
    <h2>Admin login</h2>
    <div class="err" id="loginErr"></div>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="modal-actions">
      <button class="btn" id="loginCancel">Cancel</button>
      <button class="btn primary" id="loginSubmit">Log in</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body></html>
