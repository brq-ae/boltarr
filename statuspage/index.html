<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Status</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#232a33;--text:#e6edf3;--muted:#8b949e;--up:#3fb950;--down:#f85149;--unknown:#484f58}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:32px 16px}h1{font-size:22px;margin:0 0 4px}
.updated{font-size:12px;color:var(--muted);margin-bottom:20px}
.banner{padding:12px 16px;border-radius:10px;font-weight:600;margin-bottom:20px}
.banner.ok{background:rgba(63,185,80,.12);color:var(--up)}.banner.bad{background:rgba(248,81,73,.12);color:var(--down)}
.svc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.svc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.up{background:var(--up);box-shadow:0 0 6px var(--up)}.dot.down{background:var(--down);box-shadow:0 0 6px var(--down)}.dot.unknown{background:var(--unknown)}
.svc-name{font-weight:600;flex:1}.uptime{font-size:13px;color:var(--muted)}
.ticks{display:flex;gap:2px;align-items:flex-end;height:26px}
.tick{flex:1;min-width:2px;border-radius:1px;background:var(--unknown);height:100%}
.tick.up{background:var(--up)}.tick.down{background:var(--down)}
.empty{color:var(--muted);text-align:center;padding:40px}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:24px}
</style></head><body><div class="wrap">
<h1 id="title">Service Status</h1><div class="updated" id="updated"></div>
<div id="banner"></div><div id="list"></div><div class="foot">Powered by Boltarr</div>
</div><script>
function ago(iso){if(!iso)return"never";const s=Math.floor((Date.now()-new Date(iso))/1000);
if(s<60)return s+"s ago";if(s<3600)return Math.floor(s/60)+"m ago";return Math.floor(s/3600)+"h ago"}
function esc(s){return(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// Whitelist status/tick values so only known classes can ever hit the DOM.
function cls(v){return ["up","down"].includes(v)?v:"unknown"}
async function load(){let d;try{d=await(await fetch("/data",{cache:"no-store"})).json()}catch(e){return}
document.getElementById("title").textContent=d.title||"Service Status";document.title=d.title||"Service Status";
const svcs=d.services||[];document.getElementById("updated").textContent="Updated "+ago(d.updated_at);
const anyDown=svcs.some(s=>s.status==="down");const b=document.getElementById("banner");
if(svcs.length){b.className="banner "+(anyDown?"bad":"ok");b.textContent=anyDown?"Some services are down":"All systems operational"}else b.className="";
const list=document.getElementById("list");
if(!svcs.length){list.innerHTML='<div class="empty">No services to display yet.</div>';return}
list.innerHTML=svcs.map(s=>{const up=(s.uptime_24h==null)?"—":Number(s.uptime_24h).toFixed(2)+"%";
const ticks=(s.ticks||[]).map(t=>`<div class="tick ${cls(t)}"></div>`).join("");
return `<div class="svc"><div class="svc-head"><span class="dot ${cls(s.status)}"></span>
<span class="svc-name">${esc(s.name)}</span><span class="uptime">${up} <span style="opacity:.6">24h</span></span></div>
<div class="ticks">${ticks}</div></div>`}).join("")}
load();setInterval(load,30000);
</script></body></html>
