services:
  boltarr-status:
    image: brqae/boltarr-statuspage:latest
    # To build from source instead of pulling the published image, comment the
    # `image:` line above and uncomment the line below (then use `up -d --build`):
    # build: .
    container_name: boltarr-status
    restart: unless-stopped
    ports:
      # host:container — change the LEFT (host) port if 12102 is already in use
      - "12102:12102"
    env_file:
      - .env
    volumes:
      - ./data:/data
