# Boltarr with HOST networking — use this if you want network scanning to work.
#
# Boltarr scans your LAN with nmap (host discovery, MAC addresses, the liveness
# ping tier). Docker's default *bridge* network sandboxes the container onto a
# private virtual network, so nmap can't ARP your LAN — you'd get no host
# discovery, no MAC addresses, and degraded liveness. `network_mode: host` puts
# the container on the real LAN (it shares the host's network + IP), which is
# what a scanner needs.
#
#   docker compose -f docker-compose.host.yml up -d
#
# With host networking there is no port mapping — Boltarr binds :12100 directly
# on the host, so reach it at http://<host-ip>:12100/
#
# Prefer to run Boltarr on its own box, separate from any internet-facing
# service (e.g. the public status page) — it holds your network map and SSH keys.

services:
  boltarr:
    image: brqae/boltarr:latest
    container_name: boltarr
    network_mode: host          # REQUIRED for LAN scanning (shares the host's network)
    cap_add:
      - NET_RAW                  # raw sockets for nmap (ARP / ping / SYN)
      - NET_ADMIN
    # On an UNPRIVILEGED LXC (e.g. Docker inside a Proxmox LXC) the container
    # can't load Docker's default AppArmor profile — uncomment this. It's safe:
    # Proxmox applies its own AppArmor profile to the whole LXC.
    # security_opt:
    #   - apparmor=unconfined
    volumes:
      - ./data:/app/data         # persists the database and config.yaml
    restart: unless-stopped

    # Optional: configure AI via environment instead of the UI (overrides config.yaml).
    # environment:
    #   LLM_PROVIDER: ollama
    #   LLM_BASE_URL: http://my-ollama-host:11434
    #   LLM_MODEL: llama3.2
    #   LLM_API_KEY: ""
